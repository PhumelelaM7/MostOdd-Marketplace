{% extends "store/base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h1>Login</h1>

<p>Sign in to your MostOdd Marketplace account.</p>

<!-- Login form -->
<form method="POST">

    <!-- CSRF protection -->
    {% csrf_token %}

    <!-- Display the login form -->
    {{ form.as_p }}

    <!-- Login button -->
    <button type="submit" class="btn btn-success">
        Login
    </button>

    <!-- Password reset link -->
    <p class="mt-3">

        <a href="{% url 'password_reset' %}">

            Forgot your password?

        </a>

    </p>

</form>

{% endblock %}
