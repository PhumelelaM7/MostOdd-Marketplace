<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MostOdd Marketplace{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        nav {
            background: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 30px;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            background: #333;
            color: white;
        }
    </style>

</head>

<body>



    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="/">
                MostOdd Marketplace
            </a>

            <div class="navbar-nav">

                <a class="nav-link active" href="{% url 'home' %}">Home</a>
                <a class="nav-link" href="{% url 'products' %}">Products</a>
                <a class="nav-link" href="{% url 'stores' %}">Stores</a>
                <a class="nav-link" href="{% url 'about' %}">About</a>

                <a class="nav-link" href="{% url 'cart' %}">
                    Cart
                </a>

                {% if user.is_authenticated %}

                {% if user.groups.all.0.name == "Vendor" %}

                <a class="nav-link" href="{% url 'vendor_dashboard' %}">
                    Vendor Dashboard
                </a>

                <a class="nav-link" href="{% url 'create_store' %}">
                    Create Store
                </a>

                {% endif %}

                <a class="nav-link" href="{% url 'logout_view' %}">
                    Logout
                </a>

                {% else %}

                <a class="nav-link" href="{% url 'login' %}">
                    Login
                </a>

                <a class="nav-link" href="{% url 'register' %}">
                    Register
                </a>

                {% endif %}

            </div>

        </div>

    </nav>



    <div class="container">

        {% block content %}

        {% endblock %}

    </div>

    <footer>

        <p>© 2026 MostOdd Marketplace. All Rights Reserved</p>

    </footer>

</body>

</html>
