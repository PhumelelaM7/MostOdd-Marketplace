{% extends "store/base.html" %}

{% block title %}
Delete Product
{% endblock %}

{% block content %}

<h1>Delete Product</h1>

<!-- Ask the vendor to confirm the deletion -->
<p>
    Are you sure you want to delete
    <strong>{{ product.name }}</strong>?
</p>

<!-- Confirmation form -->
<form method="POST">

    {% csrf_token %}

    <!-- Confirm deletion -->
    <button
        type="submit"
        class="btn btn-danger">

        Delete Product

    </button>

    <!-- Return to the Vendor Dashboard -->
    <a
        href="{% url 'vendor_dashboard' %}"
        class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
