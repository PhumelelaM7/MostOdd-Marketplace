{% extends "store/base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<h1>Reset Your Password</h1>

<p>
    Enter the email address associated with your account.
</p>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="btn btn-primary">

        Send Reset Email

    </button>

</form>

{% endblock %}
